<!-- Master of the launcher icon (res/drawable/ic_launcher_*.xml), cropped to the
     72dp an adaptive icon shows: the 512px Play Store icon is rendered from it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="108" y2="108">
      <stop offset="0" stop-color="#24283b"/><stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="28" y1="30" x2="80" y2="78">
      <stop offset="0" stop-color="#33ccff"/><stop offset="1" stop-color="#00ff99"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <path d="M37,32H71a10,10 0 0 1 10,10V66a10,10 0 0 1-10,10H37a10,10 0 0 1-10-10V42a10,10 0 0 1 10-10z"
        fill="none" stroke="url(#border)" stroke-width="5"/>
  <path d="M36,47L43,54L36,61" fill="none" stroke="#7aa2f7" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50,54H58M54,50V58M64,54H72M68,50V58" fill="none" stroke="#c0caf5" stroke-width="3.5"
        stroke-linecap="round"/>
</svg>
